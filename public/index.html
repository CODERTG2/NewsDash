<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsDash - AI News Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0e1117;
            color: #fafafa;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 40px 60px 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 300px;
            background: radial-gradient(ellipse at top, rgba(255, 75, 75, 0.15), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        body > * {
            position: relative;
            z-index: 1;
        }

        .header {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto 40px;
            text-align: center;
            animation: fadeInDown 0.6s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header h1 {
            font-size: 36px;
            font-weight: 700;
            color: #fafafa;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fafafa 0%, #a0a0a0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 16px;
            color: #888;
            font-weight: 400;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .chat-container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 20px;
            padding-right: 10px;
            padding-bottom: 20px;
            scroll-behavior: smooth;
        }

        .messages::-webkit-scrollbar {
            width: 8px;
        }

        .messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #262730;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .messages::-webkit-scrollbar-thumb:hover {
            background: #3d3d3d;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            transition: transform 0.2s;
        }

        .message:hover .avatar {
            transform: scale(1.05);
        }

        .message.assistant .avatar {
            background: linear-gradient(135deg, #ffc107 0%, #ff9800 100%);
            box-shadow: 0 2px 8px rgba(255, 193, 7, 0.3);
        }

        .message.user .avatar {
            background: linear-gradient(135deg, #ff4b4b 0%, #ff1744 100%);
            box-shadow: 0 2px 8px rgba(255, 75, 75, 0.3);
        }

        .message-content {
            flex: 1;
            padding: 12px 0;
            line-height: 1.6;
            color: #fafafa;
            position: relative;
        }

        .message-content::selection {
            background: rgba(255, 75, 75, 0.3);
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 0;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #666;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.5;
            }
            30% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }

        .input-section {
            margin-top: auto;
            animation: fadeInUp 0.6s ease-out 0.3s both;
            padding-top: 20px;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-wrapper {
            background: #262730;
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            gap: 8px;
            align-items: center;
            border: 1px solid #3d3d3d;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .input-wrapper:focus-within {
            border-color: #ff4b4b;
            box-shadow: 0 0 0 3px rgba(255, 75, 75, 0.1), 0 8px 24px rgba(0, 0, 0, 0.2);
            transform: translateY(-2px);
        }

        #messageInput {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fafafa;
            font-size: 15px;
        }

        #messageInput::placeholder {
            color: #666;
            transition: color 0.3s;
        }

        #messageInput:focus::placeholder {
            color: #888;
        }

        #sendButton {
            background: transparent;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 20px;
            padding: 4px 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            border-radius: 6px;
        }

        #sendButton:hover:not(:disabled) {
            color: #ff4b4b;
            background: rgba(255, 75, 75, 0.1);
            transform: scale(1.1);
        }

        #sendButton:active:not(:disabled) {
            transform: scale(0.95);
        }

        #sendButton:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .suggested-prompts {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .suggested-prompts::-webkit-scrollbar {
            height: 6px;
        }

        .suggested-prompts::-webkit-scrollbar-track {
            background: transparent;
        }

        .suggested-prompts::-webkit-scrollbar-thumb {
            background: #262730;
            border-radius: 3px;
            transition: background 0.2s;
        }

        .suggested-prompts::-webkit-scrollbar-thumb:hover {
            background: #3d3d3d;
        }

        .prompt-button {
            background: #262730;
            border: 1px solid #3d3d3d;
            border-radius: 8px;
            padding: 12px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            color: #fafafa;
            font-size: 14px;
            white-space: nowrap;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .prompt-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 75, 75, 0.1);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .prompt-button:hover::before {
            width: 300px;
            height: 300px;
        }

        .prompt-button:hover {
            background: #2d2d37;
            border-color: #ff4b4b;
            transform: translateY(-3px);
            box-shadow: 0 4px 12px rgba(255, 75, 75, 0.2);
        }

        .prompt-button:active {
            transform: translateY(-1px);
        }

        .prompt-button span {
            position: relative;
            z-index: 1;
        }

        @media (max-width: 768px) {
            body {
                padding: 20px 20px 10px;
            }

            .header h1 {
                font-size: 28px;
            }

            .header p {
                font-size: 14px;
            }

            .prompt-button {
                font-size: 13px;
                padding: 10px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>NewsDash</h1>
        <p>Your AI-Powered News Assistant</p>
    </div>

    <div class="chat-container">
        <div class="messages" id="messages">
            <div class="message assistant">
                <div class="avatar">🤖</div>
                <div class="message-content">
                    Let's start chatting! 👇
                </div>
            </div>
        </div>

        <div class="input-section">
            <div class="suggested-prompts">
                <button class="prompt-button" onclick="sendPrompt('What are the top headlines today?')">
                    <span>📰 Top headlines today</span>
                </button>
                <button class="prompt-button" onclick="sendPrompt('Latest technology news')">
                    <span>💻 Technology news</span>
                </button>
                <button class="prompt-button" onclick="sendPrompt('Business and finance updates')">
                    <span>💼 Business updates</span>
                </button>
                <button class="prompt-button" onclick="sendPrompt('World news summary')">
                    <span>🌍 World news</span>
                </button>
            </div>

            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Ask me about news..." 
                    onkeypress="handleKeyPress(event)"
                />
                <button id="sendButton" onclick="sendMessage()">
                    ➤
                </button>
            </div>
        </div>
    </div>

    <script>
        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');

        function addMessage(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = role === 'user' ? '👤' : '🤖';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function showTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message assistant';
            typingDiv.id = 'typingIndicator';
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = '🤖';
            
            const indicator = document.createElement('div');
            indicator.className = 'message-content typing-indicator';
            indicator.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            
            typingDiv.appendChild(avatar);
            typingDiv.appendChild(indicator);
            
            messagesContainer.appendChild(typingDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.remove();
            }
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            
            if (!message) return;
            
            // Add user message
            addMessage('user', message);
            messageInput.value = '';
            sendButton.disabled = true;
            
            // Show typing indicator
            showTypingIndicator();
            
            // Simulate API call delay
            // TODO: Replace this with your actual RAG model API call
            setTimeout(() => {
                removeTypingIndicator();
                
                // TODO: Replace this placeholder response with actual API response
                const response = "I'm connected to your RAG model! Replace this with your news API integration.";
                addMessage('assistant', response);
                
                sendButton.disabled = false;
                messageInput.focus();
            }, 1500);
        }

        function sendPrompt(prompt) {
            messageInput.value = prompt;
            sendMessage();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // Focus input on load
        messageInput.focus();
    </script>
</body>
</html>
