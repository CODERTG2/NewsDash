<!doctype html>
<html lang="en" data-theme="light" data-sidebar="open" data-glow="on">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>NewsDash</title>
  <style>
    /*final*/
    :root{
      --blue-500:#3b82f6; --blue-600:#2563eb; --sky-300:#7dd3fc;
      --success:#22c55e; --radius:14px; --fast:220ms; --slow:420ms;
      --sidebar-w:300px; --center-max:820px; --gutter:24px;

      --bg:#FFFEFA;
      --surface:#f8fafc; --text:#0f172a; --muted:#475569; --border:#e2e8f0; --code-bg:#f8fafc;

    }
    html[data-theme="dark"]{
      --bg:#0b1120; --surface:#0f172a; --text:#e5e7eb; --muted:#cbd5e1; --border:#1e293b; --code-bg:#0b1220;
    }

    html[data-sidebar="closed"]{
      --center-max: 1120px; 
    }

    html, body { transition: background-color var(--slow), color var(--slow), border-color var(--slow); }
    body{
      margin:0; min-height:100vh; color:var(--text); overflow-x:hidden;
      background:
        radial-gradient(1200px 800px at 10% -10%, rgba(99,102,241,.08), transparent 60%),
        radial-gradient(900px 600px at 110% 10%, rgba(59,130,246,.08), transparent 50%),
        var(--bg);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Inter, Helvetica, Arial;
    }

    .sidebar{
      position: fixed; z-index: 1000;
      left:0; top:0; bottom:0; width:var(--sidebar-w);
      background:var(--surface); border-right:1px solid var(--border);
      padding:16px; overflow:auto;
      box-shadow: 0 16px 40px rgba(0,0,0,.15);
      transition: transform var(--slow), opacity var(--slow);
    }
    html[data-sidebar="closed"] .sidebar{ transform: translateX(-102%); opacity:0; pointer-events:none; }

    .sidebar-content{
      min-height: calc(100vh - 32px);
      display:flex; flex-direction:column;
      justify-content:center;             
      gap:28px;                           
    }
    .section{ display:flex; flex-direction:column; gap:22px; } 
    .side-card{
      padding:14px; border:1px solid var(--border); border-radius:12px;
      background: color-mix(in oklab, var(--surface) 92%, transparent);
      box-shadow: 0 6px 14px rgba(0,0,0,.05);
      display:flex; flex-direction:column; gap:12px; 
    }
    .section-title{ margin:0 2px; font-size:1.06rem; font-weight:800; letter-spacing:.2px; }

    .divider{
      margin:0; border:0; height:0;
      border-top:2px solid color-mix(in srgb, var(--border) 65%, var(--text) 35%);
      box-shadow: 0 0 14px var(--glow);
    }

    .field{ display:flex; flex-direction:column; gap:8px; }
    .row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    label{ font-size:.92rem; color:var(--muted); }
    input[type="text"]{
      padding:.6rem .8rem; border-radius:12px; border:1px solid var(--border);
      background:#fff; color:#0f172a; transition:border-color var(--fast), box-shadow var(--fast);
    }
    html[data-theme="dark"] input[type="text"]{ background:var(--surface); color:var(--text); border-color:var(--border); }
    input[type="range"]{ width:100%; accent-color:var(--blue-600); }

    .latch{
      position: fixed; z-index: 1001;
      top:50%; left:calc(var(--sidebar-w) + 8px); transform:translateY(-50%);
      width:36px; height:60px; border-radius:0 12px 12px 0;
      display:flex; align-items:center; justify-content:center;
      background:var(--surface); color:var(--text); border:1px solid var(--border);
      box-shadow: 0 6px 16px rgba(0,0,0,.15);
      transition:left var(--fast), background-color var(--slow), color var(--slow), border-color var(--slow);
      cursor:pointer;
    }
    html[data-sidebar="closed"] .latch{ left:10px; border-radius:12px; }

    .app{
      position: relative; z-index: 1; min-height:100vh;
      margin-left: calc(var(--sidebar-w) + var(--gutter));
      padding: var(--gutter);
      display:flex; flex-direction:column;

      transition:
        margin-left var(--slow) ease,
        transform var(--slow) ease,
        filter var(--slow) ease;
      transform-origin: left center;
    }
    html[data-sidebar="closed"] .app{
      margin-left: var(--gutter);
      transform: scale(1.015);
    }

    .center-wrap{ 
      flex:1 0 auto; 
      display:flex;
      flex-direction: column;
      min-height: calc(100vh - 2*var(--gutter)); 
    }
    .center-stack{ 
      width:100%; 
      max-width:var(--center-max); 
      margin: 0 auto;
      display:flex; 
      flex-direction: column;
      gap:16px; 
      transition:max-width var(--slow) ease; 
    }

    .header{
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      padding: 12px 0;
      background:var(--surface);
      border-bottom:1px solid var(--border);
      margin-bottom: 20px;
    }

    .header-content {
      max-width: var(--center-max);
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 24px;
      background: color-mix(in srgb, var(--surface) 97%, transparent);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 4px 16px rgba(0,0,0,.03);
      max-height: calc(100vh - 180px);
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    .chat-message {
      display: flex;
      gap: 12px;
      max-width: 100%;
      transition: all 0.3s ease-out;
      animation: messageSlide 0.4s ease-out;
    }
    @keyframes messageSlide {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message-icon {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #fff;
    }

    .bot-icon {
      background: var(--blue-600);
    }

    .user-icon {
      background: var(--muted);
      position: relative;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .user-icon::before {
      content: "⚡";
      color: var(--muted);
    }

    .message-content {
      flex: 1;
      padding: 12px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      position: relative;
      opacity: 0;
      transform: translateY(10px);
      animation: messageAppear 0.3s ease-out forwards;
    }
    @keyframes messageAppear {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .app-title{
      margin:0; font-size:2.6rem; font-weight:800; letter-spacing:.2px;
      background:linear-gradient(90deg, var(--blue-600), var(--blue-500), var(--sky-300), var(--blue-600));
      -webkit-background-clip:text; background-clip:text; color:transparent;
      background-size:200% 100%; animation:titleShine 10s linear infinite;
      position: relative; display:inline-block; isolation:isolate;
    }
    @keyframes titleShine { 0%{background-position:0% 0} 100%{background-position:200% 0} }
    .app-sub{ color:var(--muted); font-size:1.15rem; }

    .mode-chip{
      display:inline-flex; align-items:center; gap:8px; padding:.45rem .7rem; border-radius:999px;
      border:1px solid var(--border); background:rgba(255,255,255,0.5);
      box-shadow: 0 8px 20px rgba(0,0,0,.08), 0 0 0 1px var(--border);
      font-weight:800;
    }
    html[data-theme="dark"] .mode-chip{ background:rgba(15,23,42,0.5); }
    .mode-chip .dot{ width:10px; height:10px; border-radius:999px; background:var(--blue-500); box-shadow:0 0 10px var(--glow-strong), 0 0 2px var(--blue-500) inset; }

    .app-title::after{
      content:""; position:absolute; inset: 0 auto 0 -150%; width:55%; transform:skewX(-20deg);
      background: linear-gradient(120deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.12) 40%, rgba(255,255,255,0.65) 50%, rgba(255,255,255,0.12) 60%, rgba(255,255,255,0) 100%);
      opacity:0; pointer-events:none; filter: blur(0.2px);
    }
    .app-title:hover::after{ animation: shineSweep 1.15s ease; opacity:1; }
    .app-title:hover{ text-shadow: 0 0 30px var(--glow-strong), 0 0 8px rgba(255,255,255,.35); }
    @keyframes shineSweep{ from { left:-150%; } to { left:150%; } }

    .examples{ display:flex; flex-direction:column; gap:16px; align-items:center; margin-top:8px; }
    .examples-title{ font-size:.95rem; color:var(--muted); margin-bottom:4px; }
    .chips{ display:flex; flex-wrap:wrap; gap:12px; justify-content:center; max-width:var(--center-max); padding:4px 0; }
    .chip{
      border:1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius:12px; 
      padding:.6rem 1rem; 
      font-size:.95rem; 
      line-height:1.4;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
      cursor:pointer; 
      transition: all var(--fast);
    }
    html[data-theme="dark"] .chip{
      background: linear-gradient(180deg, color-mix(in oklab, var(--surface) 75%, transparent), color-mix(in oklab, var(--surface) 85%, transparent));
      border-color: color-mix(in srgb, var(--border) 85%, var(--text) 15%);
    }
    .chip:hover{ 
      background: color-mix(in srgb, var(--surface) 98%, var(--blue-500));
      border-color: var(--blue-500);
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
    }
    .chip:focus-visible{ 
      outline: none;
      border-color: var(--blue-500);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue-500) 25%, transparent);
    }

    .search-card{
      width: 100%;
    }
    .search-row{ 
      display:grid; 
      grid-template-columns: 1fr 56px; 
      gap:10px;
    }

    .search-input{
      padding:1rem 1rem; border-radius:12px; border:1px solid var(--border);
      background:#fff; color:#0f172a; font-size:1.05rem;
      transition:border-color var(--fast), box-shadow var(--fast);
    }
    html[data-theme="dark"] .search-input{ background:var(--surface); color:var(--text); border-color:var(--border); }
    .search-input:focus{ outline:none; border-color:var(--blue-500); box-shadow:0 0 0 3px rgba(59,130,246,.25), 0 0 18px var(--glow); }

    .btn{
      border:1px solid transparent; border-radius:var(--radius);
      background:linear-gradient(135deg, var(--blue-600), var(--blue-500));
      color:#fff; padding:.75rem 1rem; font-weight:800;
      box-shadow:0 1px 3px rgba(0,0,0,.1);
      transition: all var(--fast);
      cursor:pointer;
    }
    .btn:hover{ transform:translateY(-1px); }

    .btn.secondary{
      background:transparent; color:var(--text); border:1px solid var(--border);
    }
    .btn.secondary.is-active{
      font-weight:900;
      box-shadow:0 0 0 2px var(--blue-500) inset;
      background: color-mix(in srgb, var(--blue-500) 8%, transparent);
    }
    .btn.is-on{
      box-shadow:0 0 0 2px var(--blue-600) inset;
      background: color-mix(in srgb, var(--blue-600) 8%, transparent);
    }

    .loader{
      border:6px solid rgba(148,163,184,.25); border-top:6px solid var(--blue-500);
      border-radius:50%; width:52px; height:52px; margin:18px auto;
      animation:spin 1s linear infinite; box-shadow:0 0 22px var(--glow);
    }
    @keyframes spin { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }
    .step-msg{ text-align:center; color:var(--muted); }
    .success-card{
      border:1px solid rgba(34,197,94,.35); border-radius:12px; padding:12px 16px; margin:8px 0 4px 0;
      background:linear-gradient(180deg, rgba(34,197,94,.10), rgba(34,197,94,.05));
      box-shadow:0 10px 24px rgba(0,0,0,.08), 0 0 22px rgba(34,197,94,.35);
    }
    .typing-container{
      border-radius:var(--radius); 
      padding:12px 16px; 
      border:1px solid var(--border);
      background:#fff; 
      box-shadow:0 10px 24px rgba(0,0,0,.08), 0 0 22px var(--glow);
      white-space:pre-wrap; 
      word-wrap:break-word;
      position: relative;
    }
    .typing-container::after {
      content: '█';
      display: inline-block;
      animation: blink 1s step-end infinite;
      margin-left: 2px;
      color: var(--blue-500);
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    html[data-theme="dark"] .typing-container{ background:var(--surface); }
.result-card,
.typing-container{
  width: 100%;
  max-width: var(--center-max);  
  margin: 0 auto;                
  display: block;
  box-sizing: border-box;
  overflow: hidden;              
  word-break: break-word;
  overflow-wrap: anywhere;
}

.md-output{
  max-width: 100%;
}
.md-output pre,
.md-output code{
  max-width: 100%;
  overflow: auto;                 
}
.md-output img{
  max-width: 100%;
  height: auto;
  display: block;
}
    .md-output h1,.md-output h2,.md-output h3,.md-output h4,.md-output h5,.md-output h6{ margin:0.6em 0 0.3em; }
    .md-output p{ margin:0.6em 0; }
    .md-output ul,.md-output ol{ margin:0.6em 0 0.6em 1.2em; }
    .md-output code{ background: color-mix(in oklab, var(--surface) 85%, transparent); padding:0.1em 0.3em; border-radius:6px; }
    .md-output pre{ background: var(--surface); padding:12px; border:1px solid var(--border); border-radius:10px; overflow:auto; }
    .md-output a{ color: var(--blue-600); text-decoration: underline; }

    p, span, li, ul, ol, small, strong, em, h1,h2,h3,h4,h5,h6, label { color:var(--text); }
    ::selection { background: rgba(59,130,246,.35); color:#fff; }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar" aria-label="Sidebar">
    <div class="sidebar-content">
      <div class="section">
        <h3 class="section-title">Customize UI</h3>

        <div class="side-card">
          <div class="field">
            <label for="name">Your Name</label>
            <input id="name" type="text" placeholder="Type your name…" />
          </div>
        </div>

        <div class="side-card">
          <div class="field">
            <label>Appearance</label>
            <div class="row">
              <button type="button" class="btn secondary is-active" id="lightBtn" aria-pressed="true">Light</button>
              <button type="button" class="btn secondary" id="darkBtn" aria-pressed="false">Dark</button>
            </div>
          </div>
        </div>

        <div class="side-card">
          <div class="row">
            <button type="button" class="btn" id="clearBtn">🧹 Clear Chat</button>
          </div>
        </div>
      </div>
    </div>
  </aside>

  <button type="button" id="sidebarLatch" class="latch" aria-label="Close sidebar" aria-expanded="true" title="Toggle sidebar">❮</button>

  <div class="app" id="appRoot">
    <div class="center-wrap">
      <div class="center-stack">
        <div class="header">
          <div class="header-content">
            <h1 class="app-title">NewsDash</h1>
            <div class="row">
              <div id="modeChip" class="mode-chip" title="Current color mode">
                <span class="dot"></span><span id="modeChipText">Light Mode</span>
              </div>
            </div>
          </div>
        </div>

        <div class="chat-container">
          <div class="chat-message">
            <div class="message-icon bot-icon">🤖</div>
            <div class="message-content">
              <div class="app-sub" id="greeting">What would you like to search?</div>
            </div>
          </div>

          <div class="chat-message">
            <div class="message-icon bot-icon">🤖</div>
            <div class="message-content">
              <div class="examples-title">Here are some suggested prompts you can try:</div>
              <div id="promptList" class="chips"></div>
            </div>
          </div>

          <div class="chat-message">
            <div class="message-icon user-icon"></div>
            <div class="message-content">
              <div class="search-card">
                <div class="search-row">
                  <input id="query" class="search-input" type="text" placeholder="Inquire about current events, global news, or trending topics..." />
                  <button type="button" class="btn" id="searchBtn" title="Search">🔍</button>
                </div>
              </div>
            </div>
          </div>

          <div id="statusArea"></div>
          <div id="resultArea"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    'use strict';

    // helpers
    const $ = (id) => document.getElementById(id);
    const on = (el, ev, fn) => el && el.addEventListener(ev, fn);

    // elements
    const els = {
      html: document.documentElement,
      latch: $('sidebarLatch'),
      lightBtn: $('lightBtn'),
      darkBtn: $('darkBtn'),
      glowBtn: $('glowBtn'),
      clearBtn: $('clearBtn'),
      temp: $('temp'),
      tempVal: $('tempVal'),
      chunks: $('chunks'),
      chunksVal: $('chunksVal'),
      articles: $('articles'),
      articlesVal: $('articlesVal'),
      name: $('name'),
      greeting: $('greeting'),
      modeChipText: $('modeChipText'),
      query: $('query'),
      searchBtn: $('searchBtn'),
      statusArea: $('statusArea'),
      resultArea: $('resultArea'),
      promptList: $('promptList')
    };

    // state
    const state = { dark:false, username:"", typingTimer:null, sidebarOpen:true, glow:true, hasConversation: false };

    // preset prompts
    const samplePrompts = [
      "What are the latest developments in global climate change initiatives and their economic impact?"
    ];

    // initialize 
    window.addEventListener('DOMContentLoaded', () => {
      try { Object.assign(state, JSON.parse(localStorage.getItem('mdr_ui_state') || '{}')); } catch {}
      state.sidebarOpen = true;

      setTheme(!!state.dark);
      setGlow( state.glow !== false );
      setSidebar(true, true);

      els.name && (els.name.value = state.username || '');
      els.greeting && (els.greeting.textContent = state.username ? `Hello ${state.username}, what would you like to search?` : 'What would you like to search?');

      renderPrompts();

      // sidebar + theme
      on(els.latch, 'click', () => setSidebar(!state.sidebarOpen));
      on(els.lightBtn, 'click', () => setTheme(false));
      on(els.darkBtn, 'click',  () => setTheme(true));
      on(els.glowBtn, 'click', () => setGlow(!state.glow));

      // housekeeping
      on(els.clearBtn, 'click', async () => {
        clearInterval(state.typingTimer || 0);
        els.query && (els.query.value = '');
        els.statusArea && (els.statusArea.innerHTML = '');
        els.resultArea && (els.resultArea.innerHTML = '');
        
        // Reset conversation state
        state.hasConversation = false;
        
        // Clear conversation history on MCP server
        try {
          await fetch('/api/mcp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: 'clear_history', arguments: {} })
          });
          console.log('Conversation history cleared');
        } catch (error) {
          console.error('Failed to clear history:', error);
        }
      });

      on(els.name, 'input', (e) => {
        state.username = String(e.target.value || '').trim();
        els.greeting && (els.greeting.textContent = state.username ? `Hello ${state.username}, what would you like to search?` : 'What would you like to search?');
        persist();
      });

      // search triggers
      on(els.searchBtn, 'click', runSearch);
      on(els.query, 'keydown', (e) => { if (e.key === 'Enter') runSearch(); });

      // chips click
      on(els.promptList, 'click', (e) => {
        const t = e.target;
        if (!(t instanceof HTMLElement)) return;
        if (!t.classList.contains('chip')) return;
        const p = t.getAttribute('data-prompt') || t.textContent || '';
        if (els.query){
          els.query.value = p.trim();
          els.query.focus();
        }
      });

      els.query && els.query.focus();
    });

    function persist(){ try { localStorage.setItem('mdr_ui_state', JSON.stringify(state)); } catch {} }

    // theme 
    function setTheme(dark){
      state.dark = !!dark;
      document.documentElement.setAttribute('data-theme', state.dark ? 'dark' : 'light');
      els.lightBtn && els.lightBtn.classList.toggle('is-active', !state.dark);
      els.darkBtn  && els.darkBtn.classList.toggle('is-active',  state.dark);
      els.lightBtn && els.lightBtn.setAttribute('aria-pressed', (!state.dark).toString());
      els.darkBtn  && els.darkBtn.setAttribute('aria-pressed',  (state.dark).toString());
      els.modeChipText && (els.modeChipText.textContent = state.dark ? 'Dark Mode' : 'Light Mode');
      persist();
    }

    // glow
    function setGlow(isOn){
      state.glow = !!isOn;
      document.documentElement.setAttribute('data-glow', state.glow ? 'on' : 'off');
      if (els.glowBtn){
        els.glowBtn.classList.toggle('is-active', state.glow);
        els.glowBtn.textContent = state.glow ? '✨ Glow: On' : '✨ Glow: Off';
        els.glowBtn.setAttribute('aria-pressed', state.glow.toString());
      }
      persist();
    }

    // sidebar (with smooth fill animation already handled via CSS)
    function setSidebar(open, skipPersist){
      state.sidebarOpen = !!open;
      document.documentElement.setAttribute('data-sidebar', state.sidebarOpen ? 'open' : 'closed');
      const latch = $('sidebarLatch');
      if (latch){
        latch.setAttribute('aria-expanded', state.sidebarOpen.toString());
        latch.textContent = state.sidebarOpen ? '❮' : '❯';
      }
      if (!skipPersist) persist();
    }

    // render prompt chips
    function renderPrompts(){
      if (!els.promptList) return;
      els.promptList.innerHTML = samplePrompts.map(p =>
        `<button type="button" class="chip glowable" data-prompt="${escapeAttr(p)}" title="Click to insert">${escapeHtml(p)}</button>`
      ).join('');
    }

    const steps = [
      "Creating subqueries from your query...","Searching vector DB for each subquery...",
      "Running Graph-RAG and collecting related nodes...","Feeding context into the LLM...",
      "Cross-checking intersections between retrieved articles...","Ranking by match count and semantic relevance...",
      "Evaluating the results...", "Iterating to a final response..."
    ];
    
    async function runSearch(){
      const q = (els.query && els.query.value || '').trim();
      if(!q){ els.query && els.query.focus(); return; }

      clearInterval(state.typingTimer || 0);
      els.statusArea && (els.statusArea.innerHTML = `<div class="loader glowable"></div><div class="step-msg" id="stepMsg">${steps[0]}</div>`);
      els.resultArea && (els.resultArea.innerHTML = "");

      let i=0;
      const stepper = setInterval(()=>{
        i++;
        const stepEl = document.getElementById('stepMsg');
        if(i < steps.length){ stepEl && (stepEl.textContent = steps[i]); }
        else{
          clearInterval(stepper);
          performSearch(q); // MCP call below
        }
      }, 550);
    }

    async function performSearch(query) {
      try {
        // Determine if this is a follow-up query
        const toolName = state.hasConversation ? 'follow_up' : 'search';
        
        console.log(`Using tool: ${toolName} for query: "${query}"`);
        
        const response = await fetch('/api/mcp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            name: toolName, 
            arguments: { query: query } 
          })
        });
        
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const result = await response.json();

        // Mark that we now have a conversation
        state.hasConversation = true;

        const resultHTML = formatSearchResult(result, query);
        showResult(resultHTML);
      } catch (error) {
        console.error('Search failed:', error);
        els.statusArea && (els.statusArea.innerHTML = `<div style="color: red; text-align: center;">Search failed: ${error.message}</div>`);
      }
    }

    /* ====================== markdown ====================== */
    function mdToHtml(mdRaw){
      if (!mdRaw) return "";
      let s = String(mdRaw)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

      s = s.replace(/```([\s\S]*?)```/g, (_,code) => `<pre><code>${code}</code></pre>`);

      s = s.replace(/^\s*---\s*$/gm, '<hr>');

      s = s
        .replace(/^###### (.*)$/gm,'<h6>$1</h6>')
        .replace(/^##### (.*)$/gm,'<h5>$1</h5>')
        .replace(/^#### (.*)$/gm,'<h4>$1</h4>')
        .replace(/^### (.*)$/gm,'<h3>$1</h3>')
        .replace(/^## (.*)$/gm,  '<h2>$1</h2>')
        .replace(/^# (.*)$/gm,   '<h1>$1</h1>');

      s = s
        .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
        .replace(/\*(.+?)\*/g,'<em>$1</em>')
        .replace(/`([^`]+)`/g,'<code>$1</code>')
        .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
        .replace(/(^|[^"])(https?:\/\/[^\s<>"']+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');

      s = s.replace(/(^|\n)((?:[-*] .*(?:\n|$))+)/g, (_,lead,block) => {
        const items = block.trim().split('\n').map(l => l.replace(/^[-*] /,'').trim()).filter(Boolean).map(t=>`<li>${t}</li>`).join('');
        return `${lead}<ul>${items}</ul>`;
      });

      s = s.replace(/(^|\n)((?:\d+\. .*(?:\n|$))+)/g, (_,lead,block) => {
        const items = block.trim().split('\n').map(l => l.replace(/^\d+\. /,'').trim()).filter(Boolean).map(t=>`<li>${t}</li>`).join('');
        return `${lead}<ol>${items}</ol>`;
      });

      const parts = s.split(/\n{2,}/).map(chunk => {
        if (/^\s*<(h\d|ul|ol|pre|blockquote|hr)/.test(chunk)) return chunk;
        if (chunk.trim().startsWith('<') && chunk.trim().endsWith('>')) return chunk;
        return `<p>${chunk.replace(/\n/g,'<br>')}</p>`;
      });
      return parts.join('\n');
    }

    function formatSearchResult(result, query) {
      let content = '';

      // Handle MCP server response format
      if (result && typeof result === 'object' && Array.isArray(result.content)) {
        // MCP returns content as array of objects with type and text
        content = result.content.map(item => {
          if (item?.type === 'text') {
            return item.text;
          }
          return '';
        }).join('\n');
      } else if (result && typeof result === 'object' && typeof result.content === 'string') {
        content = result.content;
      } else if (typeof result === 'string') {
        content = result;
      } else {
        content = JSON.stringify(result, null, 2);
      }

      const mdHTML = mdToHtml(content);

      return `
        <div class="result">
          <h1>Search Results: ${escapeHtml(query)}</h1>
          <div class="md-output" style="background: var(--surface); padding: 16px; border-radius: 8px; border: 1px solid var(--border);">
            ${mdHTML}
          </div>
        </div>`;
    }

    function showResult(resultHTML){
      els.statusArea && (els.statusArea.innerHTML = `<div class="chat-message">
        <div class="message-icon bot-icon">🤖</div>
        <div class="message-content">
          <div class="success-card"><b>Success</b>: Results are ready.</div>
        </div>
      </div>`);
      
      const messageDiv = document.createElement('div');
      messageDiv.className = 'chat-message';
      messageDiv.innerHTML = `
        <div class="message-icon bot-icon">🤖</div>
        <div class="message-content">
          <div class="typing-container"></div>
        </div>
      `;
      const box = messageDiv.querySelector('.typing-container');
      
      if (els.resultArea){ 
        els.resultArea.innerHTML=''; 
        els.resultArea.appendChild(messageDiv);
      }
      
      const plain = stripTags(resultHTML);
      let pos=0; const step=14;
      state.typingTimer = setInterval(()=>{
        if(pos < plain.length){ 
          box.textContent = plain.slice(0,pos) + '█'; 
          pos+=step; 
        }
        else { 
          clearInterval(state.typingTimer); 
          box.classList.add('result'); 
          box.innerHTML = resultHTML; 
        }
      }, 8);
    }

    // utils
    function stripTags(html){ const t=document.createElement('div'); t.innerHTML=html; return t.textContent || t.innerText || ""; }
    function escapeHtml(s){ return String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m] || m)); }
    function escapeAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  </script>
</body>
